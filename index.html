<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0c0e" />
  <meta name="description" content="Local notes, records, and sources." />
  <title>Security Ledger</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="app-header">
    <a class="brand" href="./" aria-label="Security Ledger home"><span>Security Ledger</span></a>
    <nav class="tabs" aria-label="Primary navigation">
      <button class="tab active" data-view="inbox" type="button">Inbox</button>
      <button class="tab" data-view="knowledge" type="button">Notes</button>
      <button class="tab" data-view="challenges" type="button">Challenges</button>
      <button class="tab" data-view="sources" type="button">Sources</button>
    </nav>
    <div class="header-actions">
      <div id="webmcpStatus" class="mcp-status" role="status"><i></i><span>Checking WebMCP</span></div>
      <button id="guideButton" class="quiet-button" type="button">WebMCP</button>
      <details class="settings">
        <summary aria-label="Open settings">•••</summary>
        <div class="settings-panel">
          <p class="eyebrow">Data</p>
          <button id="exportButton" type="button">Export</button>
          <button id="importButton" type="button">Import</button>
          <input id="importInput" type="file" accept="application/json,.json" hidden />
          <span id="storageStatus" class="storage-status"></span>
          <button id="resetButton" class="danger-action" type="button">Delete all data</button>
        </div>
      </details>
    </div>
  </header>
  <main id="main" class="workspace">
    <div id="appError" class="error-banner" role="alert" hidden></div>
    <section class="toolbar" aria-label="Controls">
      <div><p class="eyebrow" id="viewEyebrow">Inbox</p><h1 id="viewTitle">Inbox</h1></div>
      <label class="search-field"><span class="sr-only">Search</span><input id="searchInput" type="search" placeholder="Search" autocomplete="off" /></label>
    </section>
    <section id="stats" class="stats" aria-label="Record totals"></section>
    <section id="content" class="content" aria-live="polite"></section>
  </main>
  <dialog id="recordDialog" class="record-dialog">
    <div class="dialog-head"><div><p id="recordType" class="eyebrow"></p><h2 id="recordTitle"></h2></div><button class="icon-button" type="button" data-close-dialog aria-label="Close">×</button></div>
    <div id="recordBody" class="record-body"></div>
  </dialog>
  <dialog id="agentGuide" class="guide-dialog">
    <div class="dialog-head"><div><p class="eyebrow">WebMCP</p><h2>Connection</h2></div><button class="icon-button" type="button" data-close-dialog aria-label="Close">×</button></div>
    <div class="guide-copy">
      <p>This site stores the project data used by the connected agent.</p>
      <ol><li>Add material to Inbox.</li><li>Ask the agent to organize it into records.</li><li>Use the stored records during later work.</li></ol>
    </div>
  </dialog>
  <script src="./app.js"></script>
</body>
</html>
