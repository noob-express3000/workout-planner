<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#09090b" />
  <title>Workout Planner</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <h1>WORKOUT PLANNER</h1>
        <p>THIS IS ME IF I WERE COACHING</p>
      </div>
      <span id="webmcpStatus"><i></i><span>WebMCP checking</span></span>
    </header>

    <nav class="tabs" aria-label="Planner domains">
      <button class="active" data-tab="training">TRAINING</button>
      <button data-tab="protein">PROTEIN</button>
      <button data-tab="sleep">SLEEP</button>
      <button data-tab="kpi">KPI</button>
    </nav>

    <section id="trainingTab" class="tab-view active">
      <div class="program-context">
        <div><span>BLOCK</span><strong id="contextBlock">—</strong></div>
        <div><span>MESOCYCLE</span><strong id="contextMeso">—</strong></div>
        <div><span>MICROCYCLE</span><strong id="contextMicro">—</strong></div>
      </div>

      <nav class="subtabs" aria-label="Training scale">
        <button class="active" data-view="microcycle">MICROCYCLE</button>
        <button data-view="mesocycle">MESOCYCLE</button>
        <button data-view="deload">DELOAD</button>
        <button data-view="block">TRAINING BLOCK</button>
        <button data-view="ledger">LEDGER</button>
      </nav>

      <section id="trainingView" class="view"></section>
    </section>

    <section id="proteinTab" class="tab-view">
      <section id="proteinView" class="view"></section>
    </section>

    <section id="sleepTab" class="tab-view">
      <section id="sleepView" class="view"></section>
    </section>

    <section id="kpiTab" class="tab-view">
      <section id="kpiView" class="view"></section>
    </section>

    <footer>
      <span id="storageStatus">LEDGER LOADING</span>
      <div>
        <button id="exportButton" type="button">EXPORT JSON</button>
        <button id="importButton" type="button">IMPORT JSON</button>
        <input id="importInput" type="file" accept="application/json,.json" hidden />
        <button id="resetButton" type="button">CLEAR LEDGER</button>
      </div>
    </footer>
  </main>

  <script src="./app.js"></script>
  <script src="./ledger-io.js"></script>
</body>
</html>
