name: Verify

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check app.js
      - run: node --check debrief.js
      - run: node --check server.mjs
      - run: node --check server/debrief.mjs
